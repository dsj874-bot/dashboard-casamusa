<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CasaMusa — Áreas</title>
  <style>
    :root {
      --bg:        #080c14;
      --surface:   #0f1623;
      --surface2:  #141e2e;
      --border:    #1e2a3a;
      --text:      #f1f5f9;
      --muted:     #475569;
      --muted2:    #64748b;
      --accent:    #22a347;
      --amber:     #f59e0b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; }
    .topbar-brand img { height: 40px; width: auto; }
    .topbar-brand .sub { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .topbar-user { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted2); }
    .btn-logout {
      color: var(--muted2);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      transition: all .15s;
    }
    .btn-logout:hover { border-color: var(--muted2); color: var(--text); }

    .contenido { max-width: 1100px; margin: 0 auto; padding: 48px 32px 60px; }
    .titulo { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .subtitulo { font-size: 13px; color: var(--muted2); margin-bottom: 36px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 22px;
      text-decoration: none;
      color: var(--text);
      transition: border-color .15s, transform .15s;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.proximo:hover { border-color: var(--muted2); }
    .card-icon { font-size: 34px; }
    .card-nombre { font-size: 16px; font-weight: 700; }
    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      border-radius: 20px;
      padding: 4px 10px;
      width: fit-content;
    }
    .badge-activo { background: rgba(34,163,71,0.12); color: var(--accent); border: 1px solid rgba(34,163,71,0.3); }
    .badge-proximo { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.25); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-brand">
      <img src="/static/img/logo.png" alt="CasaMusa">
      <div class="sub">Panel de Gerencia</div>
    </div>
    <div class="topbar-user">
      <span>{{ session_nombre }}</span>
      <a href="/logout" class="btn-logout">⏻ Cerrar sesión</a>
    </div>
  </div>

  <div class="contenido">
    <div class="titulo">¿Qué área quieres revisar?</div>
    <div class="subtitulo">Panel de reportes de Casa Musa — selecciona un área para entrar a sus reportes.</div>

    <div class="grid">
      {% for a in areas %}
      <a href="{{ a.url }}" class="card {% if not a.activo %}proximo{% endif %}">
        <div class="card-icon">{{ a.icono }}</div>
        <div class="card-nombre">{{ a.nombre }}</div>
        {% if a.activo %}
        <span class="card-badge badge-activo">● Activo</span>
        {% else %}
        <span class="card-badge badge-proximo">🚧 En construcción</span>
        {% endif %}
      </a>
      {% endfor %}
    </div>
  </div>

</body>
</html>
