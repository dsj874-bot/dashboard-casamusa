<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CasaMusa — Acceso Gerencial</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #080c14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Fondo con gradiente sutil */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(34,163,71,0.08) 0%, transparent 70%);
      top: -100px; left: -100px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(34,163,71,0.05) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-text {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #ffffff;
    }
    .logo-text span {
      color: #22a347;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #475569;
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: #0f1623;
      border: 1px solid #1e2a3a;
      border-radius: 20px;
      padding: 40px 36px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .card-subtitle {
      font-size: 13px;
      color: #475569;
      margin-bottom: 32px;
    }

    /* Alerta de error */
    .alert-error {
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 13px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Formulario */
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      background: #080c14;
      border: 1px solid #1e2a3a;
      border-radius: 10px;
      font-size: 15px;
      color: #f1f5f9;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input::placeholder { color: #334155; }
    .field input:focus { border-color: #22a347; }

    /* Botón */
    .btn {
      width: 100%;
      padding: 14px;
      background: #22a347;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }
    .btn:hover { background: #1a8239; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: #1e2a3a;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #0f1623;
      border: 1px solid #1e2a3a;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo-area">
      <img src="/static/img/logo.png" alt="CasaMusa" style="height:70px; width:auto;">
    </div>

    <div class="card">
      <div class="card-title">Bienvenido</div>
      <div class="card-subtitle">Ingresa tus credenciales para acceder al panel de gerencia</div>

      {% if error %}
      <div class="alert-error">
        <span>⚠</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" name="email" placeholder="gerente@casamusa.cl" required autofocus>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" name="password" placeholder="••••••••••" required>
        </div>
        <button type="submit" class="btn">Ingresar →</button>
      </form>
    </div>

    <div style="text-align:center;">
      <span class="badge">🔒 Acceso restringido — Solo Gerentes</span>
    </div>

  </div>
</body>
</html>
